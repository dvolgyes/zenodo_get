---
# Generated by pcm — DO NOT EDIT manually.
# Changes will be overwritten on next `pcm render`.

ci:
  skip: [deptry, refurb, pylint, xdoctest, pytest-deadfixtures, tombi, checkstyle, pmd, clang-tidy, cppcheck, govulncheck, cargo-clippy, helm-lint, kubeconform, kube-linter, tflint, terraform-validate, tofu-validate, trivy-config, systemd-analyze-verify]

repos:
  # Source: 010_deptry.yaml [central]
  - repo: local
    hooks:
      - id: deptry
        name: Deptry dependency checker
        entry: uvx deptry .  -pri DEP004=tests/ -ee legacy/ -ee scripts/ -ee .venv -pmnm ruamel-yaml=ruamel,gitpython=git,loguru=loguru,tqdm=tqdm,coverage=coverage,pytest=pytest,pytest-cov=pytest_cov,pytest-xdist=pytest_xdist,protobuf=google,python-magic=magic,numpy=numpy,scipy=scipy,torch=torch,pandas=pandas,coveralls=coveralls
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

  # Source: 020_no_whitespace_in_filename.yaml [central]
  - repo: local
    hooks:
      - id: no-spaces-in-filenames
        name: Check for spaces in filenames
        entry: Filenames must not contain spaces
        language: fail
        files: \s

  # Source: 050_uv_audit.yaml [central]
  - repo: local
    hooks:
      - id: uv-audit
        name: uv audit
        entry: uv audit
        language: system
        files: ^uv\.lock$
        pass_filenames: false

  # Source: 100_standard_pre-commit_hooks.yaml [central]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: mixed-line-ending
        args: [--fix, lf]
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  # Source: 101_check_illegal_windows_names.yaml [central]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-illegal-windows-names

  # Source: 102_check_shebang_scripts_are_executable.yaml [central]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-shebang-scripts-are-executable

  # Source: 103_destroyed_symlinks.yaml [central]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: destroyed-symlinks

  # Source: 104_fix_byte_order_marker.yaml [central]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: fix-byte-order-marker

  # Source: 105_name_tests_test.yaml [central]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: name-tests-test

  # Source: 200_pyupgrade.yaml [central]
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py312-plus]

  # Source: 201_ruff.yaml [central]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        name: ruff-check (tests)
        files: ^tests/
        args:
          - --fix
          - --ignore=N806,TRY002,BLE001,SIM117,PLW0603,ARG001
      - id: ruff-check
        name: ruff-check (extended)
        exclude: ^(legacy/|tests/)
        args:
          - --fix
          - --extend-select=ANN,YTT,ASYNC,C4,T20,RET,SIM,PTH,FLY,NPY,PD,N,UP,FURB,RUF,TID251,PLW,BLE,S,ARG,PERF,PIE
          - --ignore=N806,TRY002,BLE001,SIM117,PLW0603,ARG001
          - --config
          - |
            [lint.flake8-tidy-imports.banned-api]
            "osgeo".msg = "Use `rasterio` (preferred) or `geopandas`/`shapely` (if necessary) instead."
            "os.path".msg = "Use the modern `pathlib` module instead of `os.path`."
            "pyyaml".msg = "Use ruamel.yaml as a yaml parsing lib"
            "ryaml".msg = "Use ruamel.yaml as a yaml parsing lib"
            "pyaml".msg = "Use ruamel.yaml as a yaml parsing lib"
      - id: ruff-format
        exclude: \.ipynb$

  # Source: 202_refurb.yaml [central]
  - repo: local
    hooks:
      - id: refurb
        name: Refurb
        entry: uvx refurb . --ignore FURB184,FURB118,FURB113,FURB124,FURB154
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

  # Source: 205_autoflake.yaml [central]
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.3.3  # Use the latest version available
    hooks:
      - id: autoflake
        args:
          - --in-place
          - --remove-all-unused-imports

  # Source: 208_pydoclint.yaml [central]
  - repo: https://github.com/jsh9/pydoclint
    rev: 0.9.1
    hooks:
      - id: pydoclint

  # Source: 209_xdoctest.yaml [central]
  - repo: local
    hooks:
      - id: xdoctest
        name: xdoctest
        entry: uv run --with xdoctest xdoctest . all --style=google
        language: system
        files: \.py$
        pass_filenames: false

  # Source: 210_pytest_deadfixtures.yaml [central]
  - repo: local
    hooks:
      - id: pytest-deadfixtures
        name: pytest dead fixtures
        entry: uv run --with pytest-deadfixtures pytest --dead-fixtures
        language: system
        files: (^|/)(conftest|test_.*|.*_test)\.py$
        pass_filenames: false

  # Source: 211_ruff_docstrings.yaml [central]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        name: ruff-docstrings
        args:
          - --fix
          - --select=D
          - --config
          - lint.pydocstyle.convention = "google"
        exclude: (^|/)(tests?|testing)/|\.ipynb$

  # Source: 220_xenon.yaml [central]
  - repo: https://github.com/yunojuno/pre-commit-xenon
    rev: v0.1
    hooks:
      - id: xenon
        args:
          - --max-absolute=C
          - --max-modules=B
          - --max-average=B

  # Source: 300_mdformat.yaml [central]
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: [--number, --wrap, '120']
        additional_dependencies:
          - mdformat-gfm
          - mdformat-ruff
          - ruff

  # Source: 304_markdown_link_check.yaml [central]
  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.15.0
    hooks:
      - id: markdown-link-check

  # Source: 305_typos.yaml [central]
  - repo: https://github.com/crate-ci/typos
    rev: v1.48.0
    hooks:
      - id: typos

  # Source: 306_codespell.yaml [central]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  # Source: 307_rstcheck.yaml [central]
  - repo: https://github.com/rstcheck/rstcheck
    rev: v6.3.0
    hooks:
      - id: rstcheck

  # Source: 308_html_validate.yaml [central]
  - repo: local
    hooks:
      - id: html-validate
        name: html-validate
        entry: html-validate
        language: node
        additional_dependencies:
          - html-validate@11.5.6
        types: [html]

  # Source: 310_prettier.yaml [central]
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        args: [--write]
        files: \.(?i:css|graphql|html|js|jsx|json|scss|ts|tsx|vue|yaml|yml)$
        exclude: \.(?i:md|toml|yaml|yml)$

  # Source: 320_yaml_format.yaml [central]
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        args:
          - -formatter
          - indent=2,include_document_start=true,pad_line_comments=2,retain_line_breaks_single=true

  # Source: 321_yamllint.yaml [central]
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--config-data, '{extends: default, rules: {line-length: disable}}']

  # Source: 330_tombi.yaml [central]
  - repo: local
    hooks:
      - id: tombi-formatter
        name: Tombi TOML linter
        entry: uvx tombi format
        language: system
        types: [toml]

      - id: tombi-linter
        name: Tombi TOML linter
        entry: uvx tombi lint --error-on-warnings
        language: system
        types: [toml]

  # Source: 331_check_jsonschema.yaml [central]
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-compose-spec
      - id: check-dependabot
      - id: check-github-actions
      - id: check-github-workflows
      - id: check-renovate

  # Source: 332_validate_pyproject.yaml [central]
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  # Source: 340_dotenv_linter.yaml [central]
  - repo: https://github.com/wemake-services/dotenv-linter
    rev: 0.9.0
    hooks:
      - id: dotenv-linter

  # Source: 450_mypy.yaml [central]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        exclude: ^(legacy/|tests/)
        args: [--ignore-missing-imports, --strict]
        additional_dependencies: [types-requests, types-click, types-setuptools]

  # Source: 500_actionlint.yaml [central]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Source: 510_gitleaks.yaml [central]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Source: 511_zizmor.yaml [central]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor

  # Source: 512_osv_scanner.yaml [central]
  - repo: https://github.com/google/osv-scanner
    rev: v2.5.1
    hooks:
      - id: osv-scanner

  # Source: 513_trufflehog.yaml [central]
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.97.0
    hooks:
      - id: trufflehog

  # Source: 514_detect_secrets.yaml [central]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

  # Source: 540_google_java_format.yaml [central]
  - repo: local
    hooks:
      - id: google-java-format
        name: google-java-format
        entry: google-java-format --replace
        language: system
        files: \.java$

  # Source: 541_checkstyle.yaml [central]
  - repo: local
    hooks:
      - id: checkstyle
        name: checkstyle
        entry: checkstyle
        language: system
        files: \.java$
        args:
          - -c
          - config/checkstyle/checkstyle.xml

  # Source: 542_pmd.yaml [central]
  - repo: local
    hooks:
      - id: pmd
        name: pmd
        entry: pmd check
        language: system
        files: \.java$
        args:
          - -R
          - rulesets/java/quickstart.xml
          - -d

  # Source: 550_oxlint.yaml [central]
  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v1.74.0
    hooks:
      - id: oxlint

  # Source: 600_jupyter_ruff_format.yaml [central]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-format
        name: ruff-format (Jupyter code cells)
        files: \.ipynb$
        types_or: [jupyter]

  # Source: 601_jupyter_markdown_format.yaml [central]
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa
        name: mdformat (Jupyter Markdown cells)
        files: \.ipynb$
        types_or: [jupyter]
        args: [mdformat, --nbqa-md]
        additional_dependencies:
          - mdformat==1.0.0
          - mdformat-gfm

  # Source: 602_jupyter_strip_state.yaml [central]
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        name: Strip Jupyter outputs and transient state
        files: \.ipynb$
        args:
          - --keep-id
          - >-
            --extra-keys=metadata.celltoolbar metadata.language_info.version metadata.toc metadata.notify_time metadata.varInspector cell.metadata.code_folding #magic___^_^___line
  # Source: 610_checkmake.yaml [central]
  - repo: https://github.com/checkmake/checkmake
    rev: v0.3.2
    hooks:
      - id: checkmake
        files: (^|/)(GNUmakefile|[Mm]akefile|.*\.(mk|make))$

  # Source: 611_cmake_format.yaml [central]
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format

  # Source: 620_clang_tidy.yaml [central]
  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy
        language: system
        files: \.(c|cc|cpp|cxx)$
        types_or: [c, c++]
        args: [--quiet, --warnings-as-errors=*]

  # Source: 621_cppcheck.yaml [central]
  - repo: local
    hooks:
      - id: cppcheck
        name: Cppcheck
        entry: cppcheck
        language: system
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
        types_or: [c, c++]
        args:
          - --enable=warning,style,performance,portability
          - --error-exitcode=1
          - --inline-suppr
          - --suppress=missingIncludeSystem

  # Source: 630_golangci_lint.yaml [central]
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint-full
        files: \.go$

  # Source: 631_govulncheck.yaml [central]
  - repo: local
    hooks:
      - id: govulncheck
        name: govulncheck
        entry: govulncheck ./...
        language: system
        files: (^|/)(go\.mod|go\.sum|.*\.go)$
        pass_filenames: false

  # Source: 640_cargo_clippy.yaml [central]
  - repo: local
    hooks:
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        files: (^|/)(Cargo\.(toml|lock)|.*\.rs)$
        pass_filenames: false

  # Source: 650_helm_lint.yaml [central]
  - repo: local
    hooks:
      - id: helm-lint
        name: Helm lint
        entry: >-
          bash -c 'find . -name .git -prune -o -name Chart.yaml -exec dirname {} \; | sort -u | xargs -r -n1 helm lint' --
        language: system
        files: (^|/)(Chart\.yaml|values[^/]*\.ya?ml|templates/.*\.ya?ml)$
        pass_filenames: false

  # Source: 651_kubeconform.yaml [central]
  - repo: local
    hooks:
      - id: kubeconform
        name: kubeconform
        entry: kubeconform -strict -summary -ignore-missing-schemas
        language: system
        files: (^|/)(k8s|kubernetes|manifests)/.*\.ya?ml$
        types: [yaml]

  # Source: 652_kubelinter.yaml [central]
  - repo: local
    hooks:
      - id: kube-linter
        name: KubeLinter
        entry: kube-linter lint
        language: system
        files: (^|/)(k8s|kubernetes|manifests)/.*\.ya?ml$
        types: [yaml]

  # Source: 653_ansible_lint.yaml [central]
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.8.0
    hooks:
      - id: ansible-lint
        language_version: python3
        always_run: false
        files: (^|/)(\.ansible-lint|ansible\.cfg|galaxy\.ya?ml|requirements\.ya?ml|(site|main)\.ya?ml|(playbooks?|roles|tasks|handlers|defaults|vars|meta)/.*\.ya?ml)$

  # Source: 660_tflint.yaml [central]
  - repo: local
    hooks:
      - id: tflint
        name: TFLint
        entry: tflint --recursive
        language: system
        files: (^|/)(\.tflint\.hcl|.*\.tf|.*\.tfvars)$
        pass_filenames: false

  # Source: 661_terraform_validate.yaml [central]
  - repo: local
    hooks:
      - id: terraform-validate
        name: Terraform validate
        entry: >-
          bash -c 'for file in "$@"; do dirname "$file"; done | sort -u | while IFS= read -r directory; do terraform -chdir="$directory" validate || exit; done' --
        language: system
        files: (^|/)(\.terraform\.lock\.hcl|.*\.tf|.*\.tfvars)$

  # Source: 662_tofu_validate.yaml [central]
  - repo: local
    hooks:
      - id: tofu-validate
        name: OpenTofu validate
        entry: >-
          bash -c 'for file in "$@"; do dirname "$file"; done | sort -u | while IFS= read -r directory; do tofu -chdir="$directory" validate || exit; done' --
        language: system
        files: (^|/)(\.terraform\.lock\.hcl|.*\.tf|.*\.tfvars)$

  # Source: 663_trivy_config.yaml [central]
  - repo: local
    hooks:
      - id: trivy-config
        name: Trivy configuration scan
        entry: trivy config --exit-code 1 .
        language: system
        files: >-
          (^|/)(Dockerfile[^/]*|.*\.tf|Chart\.yaml|values[^/]*\.ya?ml| (k8s|kubernetes|manifests)/.*\.ya?ml)$
        pass_filenames: false

  # Source: 664_systemd_analyze_verify.yaml [central]
  - repo: local
    hooks:
      - id: systemd-analyze-verify
        name: systemd-analyze verify
        entry: systemd-analyze verify
        language: system
        files: \.(automount|device|mount|path|scope|service|slice|socket|swap|target|timer)$

  # Source: 670_spectral.yaml [central]
  - repo: local
    #  # Source: 665_checkov.yaml [central]
    #  - repo: https://github.com/bridgecrewio/checkov.git
    #    rev: 3.3.11
    #    hooks:
    #      - id: checkov
    #        files: \.(?i:json|tf|tfvars|yaml|yml)$

    hooks:
      - id: spectral
        name: Spectral OpenAPI lint
        entry: spectral lint --ruleset spectral:oas
        language: node
        files: (^|/)(openapi|swagger)(\.[^/]*)?\.(json|ya?ml)$
        additional_dependencies:
          - '@stoplight/spectral-cli@6.16.2'

  # Source: 680_hadolint.yaml [central]
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint
        files: (^|/)Dockerfile[^/]*$

  # Source: 690_sqlfluff.yaml [central]
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.3.0
    hooks:
      - id: sqlfluff-lint
        files: \.sql$
        args: [--dialect=ansi]

  # Source: 900_shfmt.yaml [central]
  - repo: https://github.com/maxwinterstein/shfmt-py
    rev: v4.0.0
    hooks:
      - id: shfmt

  # Source: 950_shellcheck.yaml [central]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
